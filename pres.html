<body>
<div class="container">
    <h2>Eventos Realizados</h2>

    <!-- botão com classe no-print para não aparecer na impressão -->
    <button class="btn no-print" onclick="adicionarLinha()">+ Adicionar Evento</button>

    <table id="tabela-eventos">
        <thead>
            <tr>
                <th>Evento</th>
                <th>Data</th>
                <th>Quantidade</th>
                <th>Subtotal</th>
                <!-- th com classe no-print: não será impresso -->
                <th class="no-print">Ação</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="total_serviços" id="total-apresentacoes">Total de Apresentações: 0</td>
                <td class="total_serviços" id="total-geral">R$ 0,00</td>
                <td class="no-print"></td>
            </tr>
        </tfoot>
    </table>
</div>
</body>
<script src="js/animacao-unificada.js"></script>
<script>
function salvarTabela() {
    const linhas = [];
    document.querySelectorAll("#tabela-eventos tbody tr").forEach(linha => {
        const tds = Array.from(linha.querySelectorAll("td")).slice(0, 4);
        const cols = tds.map(td => td.innerText);
        linhas.push(cols);
    });
    localStorage.setItem("eventosTabela", JSON.stringify(linhas));
}

function carregarTabela() {
    const dados = JSON.parse(localStorage.getItem("eventosTabela") || "[]");
    if (dados.length === 0) {
        adicionarLinha("Carnaval 2025 – 1º dia", "01/03/2025", 500);
    } else {
        dados.forEach(c => {
            // c[0]=evento, c[1]=data, c[2]=quantidade (será recalculada), c[3]=subtotal
            const subtotal = parseFloat(String(c[3]).replace(",", ".")) || 0;
            adicionarLinha(c[0], c[1], subtotal);
        });
    }
}

function atualizarTotais() {
    const linhas = document.querySelectorAll("#tabela-eventos tbody tr");
    let totalApresentacoes = linhas.length;
    let soma = 0;
    linhas.forEach(linha => {
        const subtotalText = linha.cells[3].innerText || "0";
        const subtotal = parseFloat(String(subtotalText).replace(",", ".")) || 0;
        soma += subtotal;
    });

    document.getElementById("total-apresentacoes").innerText = `Total de Apresentações: ${totalApresentacoes}`;
    document.getElementById("total-geral").innerText = "R$ " + soma.toFixed(2).replace(".", ",");
    salvarTabela();
}

/**
 * adiciona uma linha. quantidade é sequencial e gerada automaticamente.
 * subtotal é editável (string com vírgula é aceita).
 */
function adicionarLinha(evento = "Novo Evento", data = "dd/mm/aaaa", subtotal = 500) {
    const tabela = document.querySelector("#tabela-eventos tbody");
    const novaLinha = tabela.insertRow();

    const numeroSequencial = tabela.rows.length; // já é a sequência correta (1..n)

    // Certifica formato do subtotal
    const s = (typeof subtotal === "number") ? subtotal.toFixed(2).replace(".", ",") : String(subtotal);

    novaLinha.innerHTML = `
        <td contenteditable="true">${evento}</td>
        <td contenteditable="true">${data}</td>
        <td>${numeroSequencial}</td>
        <td contenteditable="true">${s}</td>
        <td class="no-print"><button class="btn-danger" onclick="removerLinha(this)">Excluir</button></td>
    `;

    // eventos para atualizar totais quando o usuário editar
    novaLinha.cells[0].addEventListener("input", atualizarTotais);
    novaLinha.cells[1].addEventListener("input", atualizarTotais);
    novaLinha.cells[3].addEventListener("input", atualizarTotais);

    atualizarTotais();
}

function removerLinha(botao) {
    botao.closest("tr").remove();
    atualizarNumeracao();
    atualizarTotais();
}

function atualizarNumeracao() {
    document.querySelectorAll("#tabela-eventos tbody tr").forEach((linha, index) => {
        linha.cells[2].innerText = index + 1;
    });
}

// inicializa a tabela
carregarTabela();
</script>
