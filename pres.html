<script>
function parseMoedaBR(valor) {
    const texto = String(valor ?? "").trim();
    if (!texto) return 0;

    // Remove simbolos e espacos, mantendo apenas digitos, sinais e separadores.
    const limpo = texto.replace(/[^\d,.-]/g, "");
    if (!limpo) return 0;

    // Se houver virgula, ela e decimal (pt-BR) e pontos sao milhares.
    if (limpo.includes(",")) {
        const normalizado = limpo.replace(/\./g, "").replace(",", ".");
        return parseFloat(normalizado) || 0;
    }

    // Sem virgula, aceita formato decimal com ponto.
    return parseFloat(limpo) || 0;
}

function formatarMoedaBR(valor) {
    return valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function salvarTabela() {
    const linhas = [];
    document.querySelectorAll("#tabela-eventos tbody tr").forEach(linha => {
        // Formato atual: [evento, data, subtotal]
        const evento = linha.cells[0].innerText;
        const data = linha.cells[1].innerText;
        const subtotal = linha.cells[2].innerText;
        linhas.push([evento, data, subtotal]);
    });
    localStorage.setItem("eventosTabela", JSON.stringify(linhas));
}

function carregarTabela() {
    const dados = JSON.parse(localStorage.getItem("eventosTabela") || "[]");
    if (dados.length === 0) {
        adicionarLinha();
    } else {
        dados.forEach(c => {
            // Compatibilidade: aceita [evento, data, quantidade, subtotal] e [evento, data, subtotal]
            const subtotalRaw = c.length >= 4 ? c[3] : c[2];
            const subtotal = parseMoedaBR(subtotalRaw);
            adicionarLinha(c[0], c[1], subtotal);
        });
    }
}

function atualizarTotais() {
    const linhas = document.querySelectorAll("#tabela-eventos tbody tr");
    let totalApresentacoes = linhas.length;
    let soma = 0;
    linhas.forEach(linha => {
        const subtotalText = linha.cells[2].innerText || "0";
        const subtotal = parseMoedaBR(subtotalText);
        soma += subtotal;
    });

    document.getElementById("total-apresentacoes").innerText = `Total de Apresentações: ${totalApresentacoes}`;
    document.getElementById("total-geral").innerText = formatarMoedaBR(soma);
    salvarTabela();
}

/**
 * Adiciona uma linha com subtotal editavel (string com virgula e aceita).
 */
function adicionarLinha(evento = "", data = "", subtotal = "") {
    const tabela = document.querySelector("#tabela-eventos tbody");
    const novaLinha = tabela.insertRow();

    // Certifica formato do subtotal
    const s = String(subtotal ?? "").trim() === "" ? "" : formatarMoedaBR(parseMoedaBR(subtotal));

    novaLinha.innerHTML = `
        <td contenteditable="true" data-placeholder="Evento">${evento}</td>
        <td contenteditable="true" data-placeholder="dd/mm/aaaa">${data}</td>
        <td contenteditable="true" data-placeholder="R$ 0,00">${s}</td>
        <td class="no-print"><button class="btn-danger" onclick="removerLinha(this)">Excluir</button></td>
    `;

    // eventos para atualizar totais quando o usuário editar
    novaLinha.cells[0].addEventListener("input", atualizarTotais);
    novaLinha.cells[1].addEventListener("input", atualizarTotais);
    novaLinha.cells[2].addEventListener("input", atualizarTotais);
    novaLinha.cells[2].addEventListener("blur", (event) => {
        if (String(event.target.innerText).trim() === "") {
            atualizarTotais();
            return;
        }
        const valor = parseMoedaBR(event.target.innerText);
        event.target.innerText = formatarMoedaBR(valor);
        atualizarTotais();
    });

    atualizarTotais();
}

function removerLinha(botao) {
    botao.closest("tr").remove();
    atualizarTotais();
}

// inicializa a tabela
carregarTabela();
</script>
